[build-system]
requires = ["setuptools<84.0.0", "setuptools_scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoctave"
description = "simply python wrapper for octave"
readme = "README.md"
authors = [{ name = "Equinor ASA", email = "fg_sib-scout@equinor.com" }]
license = "LGPL-3.0-or-later"
license-files = ["License.md"]
requires-python = ">=3.11, <3.16"
dynamic = ["version"]
classifiers = [
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["scipy>=1.10", "pexpect"]

[project.urls]
Homepage = "https://github.com/equinor/pyoctave"

[dependency-groups]
dev = ["pytest>=7.2", "black", "isort", "flake8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.uv]
exclude-newer = "7 days"
