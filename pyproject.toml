[build-system]
requires = ["setuptools<84.0.0", "setuptools_scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoctave"
description = "simply python wrapper for octave"
readme = "README.md"
authors = [{ name = "Equinor ASA", email = "fg_gpl@equinor.com" }]
license = "LGPL-3.0-or-later"
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["scipy>=1.10", "pexpect"]

[dependency-groups]
dev = ["pytest>=7.2", "black", "isort", "flake8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Fallback needed due to https://github.com/dependabot/dependabot-core/issues/12340
fallback_version = "0.0.0"

[tool.uv]
exclude-newer = "7 days"
